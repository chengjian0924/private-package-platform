# 源鉴 · 容器内 Nginx 网关（预留配置，默认不启用）
# 启用方式见 docs/CONTAINER_DEPLOYMENT.md「切换到网关模式」。
# 对照 deploy/nginx-yuanjian.conf（systemd 单进程版）：本文件把单一 upstream 拆成三个角色上游。
# 注意：上游用 compose 服务名解析，因此只在同一 compose 网络内可用。

upstream yuanjian_console {
    server console:3000;
    keepalive 32;
}

upstream yuanjian_npm {
    server npm:3000;
    keepalive 32;
}

upstream yuanjian_pypi {
    server pypi:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yuanjian.example.internal;

    ssl_certificate     /etc/nginx/ssl/yuanjian.example.internal.crt;
    ssl_certificate_key /etc/nginx/ssl/yuanjian.example.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 需容纳 npm publish 的 base64 请求体（200MB 包体 ≈ 267MB），
    # 略高于应用 MAX_NPM_PUBLISH_BYTES（默认 288MB），网关兜底而不截断业务
    client_max_body_size 300m;
    # 发布链路含同步扫描，大包响应可能超过默认 60s
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # 不对外暴露指标端点，仅容器内直连抓取
    location /metrics {
        return 404;
    }

    location /npm/ {
        proxy_pass http://yuanjian_npm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pypi/ {
        proxy_pass http://yuanjian_pypi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://yuanjian_console;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
