# 源鉴 · 内网依赖安全治理平台 Nginx 站点配置样例（关闭 R-A4-03）
# 安装：sudo cp deploy/nginx-yuanjian.conf /etc/nginx/conf.d/yuanjian.conf && sudo nginx -t && sudo systemctl reload nginx
# 证书：由内网 CA 签发后放置到下方 ssl_certificate 路径（占位符需替换）

# 应用只监听 127.0.0.1（BIND_HOST=127.0.0.1），网关为唯一流量入口
upstream yuanjian_app {
    server 127.0.0.1:3000;
    # 长连接复用，降低内网高频 tarball 请求的握手开销
    keepalive 32;
}

# 80 端口仅做跳转，不承载业务（避免明文通道残留）
server {
    listen 80;
    server_name yuanjian.example.internal;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yuanjian.example.internal;

    # ---- TLS：证书路径为占位符，部署时替换为内网 CA 签发的实体 ----
    ssl_certificate     /etc/nginx/ssl/yuanjian.example.internal.crt;
    ssl_certificate_key /etc/nginx/ssl/yuanjian.example.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：强制浏览器后续走 https（有效期 1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体上限：需容纳 npm publish 的 base64 请求体（200MB 包体 ≈ 267MB），
    # 略高于应用 MAX_NPM_PUBLISH_BYTES（默认 288MB），网关兜底而不截断业务；
    # 下调应用上限时此处同步调整
    client_max_body_size 300m;

    # 发布链路含同步扫描，大包响应可能超过默认 60s
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # Prometheus 在本机直连 127.0.0.1:3000/metrics（配 METRICS_TOKEN），
    # 网关不暴露该路径，杜绝绕过令牌的抓取入口
    location /metrics {
        return 404;
    }

    location / {
        proxy_pass http://yuanjian_app;
        proxy_http_version 1.1;
        # keepalive 上游需清空 Connection 头，否则退化为短连接
        proxy_set_header Connection "";

        # 透传 Nginx 内置 $request_id（32 位 hex）；应用侧复用它做 traceId，
        # 响应回发 X-Trace-Id，实现网关-应用-审计三方关联
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

